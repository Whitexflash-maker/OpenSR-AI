name: Build debug APK

# Manual only: pushing files from a phone creates many commits, and we do not want a build per commit.
# Start it from the repo's Actions tab -> "Build debug APK" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-debug-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify model asset (size and SHA-256)
        run: |
          ls -l app/src/main/assets/
          test "$(stat -c %s app/src/main/assets/super-resolution-10.onnx)" = "240078"
          echo "85f36ff88cc504a24af5e0602148bc56a8aa09a58eca8c0da2756f3e8186035e  app/src/main/assets/super-resolution-10.onnx" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13 (no wrapper in this repo)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenSR-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Upload reports (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
